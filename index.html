<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Seasonal ids</title>
        <style>
             
          h2 {
            color: rgb(150, 88, 6)
          }  
            
        </style>
    </head>
    <body>
        
        <h1> Simba's favorite rock</h1>
        
        <h2 id="summer">Summer</h2>
        <p>He walks along the path that passes his favorite rock every morning. The hot, red, morning sun feels like a coat against his fur. It can't get much better than this.</p>
        
        <h2 id="winter">Winter</h2>
        <p>He likes to stay in and cuddle</p>
    </body>
</html>
